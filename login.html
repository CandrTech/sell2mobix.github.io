<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f2a1d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2314b856'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inloggen — Mobix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <aside class="login-aside">
    <a class="login-logo" href="index.html">m<span>o</span>bix</a>
    <div><h2>Alle aanvragen op één plek</h2><p>Log in om inruilaanvragen, ordernummers en uitbetalingen te beheren.</p></div>
    <small>© Mobix</small>
  </aside>

  <main class="login-wrap">
    <div class="login-card">
      <a class="login-back" href="index.html">← Terug naar de website</a>
      <h1>Welkom terug</h1>
      <p class="login-sub">Log in op je Mobix-account.</p>

      <form id="loginForm">
        <label class="login-label" for="email">E-mailadres</label>
        <input class="login-input" id="email" type="email" placeholder="jouw@email.nl" autocomplete="username" required>

        <label class="login-label" for="password">Wachtwoord</label>
        <input class="login-input" id="password" type="password" placeholder="Je wachtwoord" autocomplete="current-password" required>

        <div class="forgot"><a href="#">Wachtwoord vergeten?</a></div>

        <button class="primary" type="submit">Inloggen</button>
        <div class="login-message" id="message" role="alert">Vul een geldig e-mailadres en wachtwoord in.</div>
      </form>

      <div class="register">Nog geen account? <a href="#">Account aanmaken</a></div>
    </div>
  </main>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("message");

  if (email === "CandrPhones@gmail.com" && password === "Mobix2026!!") {
    msg.style.display = "none";
    window.location.href = "dashboard.html";
  } else {
    msg.textContent = "Onjuiste e-mail of wachtwoord.";
    msg.style.display = "block";
  }
});
</script>
</body>
</html>
